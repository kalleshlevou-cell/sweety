version: '3.8'

services:
  # MongoDB database
  db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - '27017:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Express API server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGODB_URL: mongodb://root:rootpassword@db:27017
      JWT_SECRET: sweety_docker_secret_change_me
      JWT_EXPIRES_IN: 7d

  # React frontend (dev server)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '5173:5173'
    depends_on:
      - server

volumes:
  mongodata:
